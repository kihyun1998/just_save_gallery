name: just_save_gallery
description: A lightweight Flutter plugin that saves images and videos to the device gallery. Supports both raw bytes and file path inputs on Android and iOS.
version: 0.1.0
homepage: https://github.com/kihyun1998/just_save_gallery

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.just_save_gallery
        pluginClass: JustSaveGalleryPlugin
      ios:
        pluginClass: JustSaveGalleryPlugin
